name: Desplegar infraestructura (dev)

run-name: ${{ github.actor }} despliega la infraestructura en dev

on:
  push:
    branches:
      - development

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_aws_region: "sa-east-1"
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Configurar Python 3.11 para construir la Lambda Layer del motor IA
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Construir Lambda Layer (PuLP + scikit-learn para Linux x86_64)
        run: |
          mkdir -p layer_motor/python
          pip install --quiet \
            --platform manylinux2014_x86_64 \
            --target layer_motor/python \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: --upgrade \
            pulp scikit-learn
          rm -rf layer_motor/python/pulp/solverdir/cbc/win* \
                 layer_motor/python/pulp/solverdir/cbc/osx* \
                 layer_motor/python/pulp/solverdir/cbc/linux/32 \
                 layer_motor/python/sklearn/datasets
          find layer_motor/python -type d \( -name "tests" -o -name "test" -o -name "__pycache__" \) -prune -exec rm -rf {} +
          find layer_motor/python -type f \( -name "*.pyc" -o -name "*.pyo" -o -name "*.pyi" -o -name "*.a" \) -delete
          find layer_motor/python -name "*.so*" -exec strip --strip-unneeded {} + 2>/dev/null || true
          chmod +x layer_motor/python/pulp/solverdir/cbc/linux/64/cbc || true
          du -sh layer_motor/python

      - name: Obtener credenciales temporales de AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - name: Comprobar la identidad asumida
        run: aws sts get-caller-identity

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform init (estado remoto en S3)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lab09/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'sa-east-1' }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="workspace_key_prefix=lab09/dev/env"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Mostrar salidas
        run: terraform output
