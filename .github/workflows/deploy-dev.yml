name: Desplegar infraestructura (dev)

run-name: ${{ github.actor }} despliega la infraestructura en dev

on:
  push:
    branches:
      - development

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_aws_region: "sa-east-1"
      TF_VAR_correo_remitente: ${{ vars.SES_EMAIL || 'quemantocoronelgamer@gmail.com' }}
      TF_VAR_correo_alertas: ${{ vars.ALERT_EMAIL || vars.SES_EMAIL || 'quemantocoronelgamer@gmail.com' }}
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Obtener credenciales temporales de AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - name: Comprobar la identidad asumida y actualizar política IAM del rol OIDC
        run: |
          aws sts get-caller-identity
          ROLE_NAME=$(echo "${{ vars.AWS_ROLE_ARN }}" | awk -F'/' '{print $NF}')
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "nutriperu-ci-servicios-completos" \
            --policy-document file://politica-github-actions.json || true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Terraform init (estado remoto en S3)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lab09/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'sa-east-1' }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="workspace_key_prefix=lab09/dev/env"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Mostrar salidas
        run: terraform output
